name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# No token rights by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    # Pinned image: a floating "latest" can change Python, PowerShell or Inno
    # Setup paths between two releases.
    runs-on: windows-2022
    permissions:
      contents: read   # tests, pip and the build run here and never hold a write token

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0            # the guard below needs origin/main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      # Refuse to publish from a stray or stale tag: the commit must be on main
      # and the tag must be strictly newer than the latest published release, or
      # clients would be offered a downgrade or a duplicate. tools/version_sync.py
      # owns the comparison.
      - name: Check the tag against main and the latest release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not on main; tag releases from main only."
            exit 1
          fi
          err="$RUNNER_TEMP/gh-latest.err"
          if prev=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$err"); then
            :
          elif grep -q "HTTP 404" "$err"; then
            prev=""    # first release
          else
            cat "$err"
            echo "::error::Could not read the latest release; not publishing blind."
            exit 1
          fi
          python tools/version_sync.py --check-tag "$RELEASE_TAG" --previous "$prev"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      # Single writer of the version metadata: version.py, file_version_info.txt
      # and istari.iss all come from tools/version_sync.py. The tag is passed
      # through the environment, and the script itself only accepts
      # vMAJOR.MINOR.PATCH, so the value never reaches a shell unvalidated.
      #
      # `shell: bash` is load-bearing: the runner's default is PowerShell, where
      # "$RELEASE_TAG" is a PowerShell variable (empty, no error) instead of the
      # environment variable, and the step would then ship the version already in
      # the tree. `--from-tag` also writes the derived files, so the tree cannot
      # keep a stale one.
      - name: Write the version metadata from the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/version_sync.py --from-tag "$RELEASE_TAG"

      - name: Verify the version metadata is consistent
        run: python tools/version_sync.py --check

      - name: Expose the validated version to later steps
        id: ver
        shell: bash
        run: echo "VERSION=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build with PyInstaller
        run: pyinstaller Istari.spec

      # Cheap artifact check (no GUI launch on a headless runner): the exe exists
      # and carries the version resource of the tag being released.
      - name: Smoke-check the built exe
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          $exe = "dist/Istari/Istari.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $info = (Get-Item $exe).VersionInfo
          $expected = "$env:VERSION.0"
          if ($info.FileVersion -ne $expected -or $info.ProductVersion -ne $expected) {
            throw "Istari.exe reports $($info.FileVersion) / $($info.ProductVersion), expected $expected"
          }
          Write-Host "Istari.exe OK: $($info.FileVersion)"

      # Pinned so the ISCC path below cannot move under a release (6.x installs
      # to "Inno Setup 6").
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" istari.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $setup = "installer/Istari_Setup.exe"
          if (-not (Test-Path $setup) -or (Get-Item $setup).Length -lt 1MB) { throw "$setup is missing or too small" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  Istari_Setup.exe" | Out-File -Encoding ascii installer/Istari_Setup.exe.sha256
          $written = ((Get-Content installer/Istari_Setup.exe.sha256 -Raw) -split '\s+')[0]
          if ($written -ne $hash) { throw "checksum file does not match the installer" }

      - name: Upload the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: installer
          path: |
            installer/Istari_Setup.exe
            installer/Istari_Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job with write access; it runs no repository code

    steps:
      - name: Download the release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: installer
          path: installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            installer/Istari_Setup.exe
            installer/Istari_Setup.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
