name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      # Single writer of the version metadata: version.py, file_version_info.txt
      # and istari.iss all come from tools/version_sync.py. The tag is passed
      # through the environment, and the script itself only accepts
      # vMAJOR.MINOR.PATCH, so the value never reaches a shell unvalidated.
      - name: Write version.py from the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/version_sync.py --from-tag "$RELEASE_TAG"

      - name: Verify the version metadata is consistent
        run: python tools/version_sync.py --check

      - name: Expose the validated version to later steps
        id: ver
        shell: bash
        run: echo "VERSION=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build with PyInstaller
        run: pyinstaller Istari.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.VERSION }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" istari.iss

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer/Istari_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Istari_Setup.exe" | Out-File -Encoding ascii installer/Istari_Setup.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Istari_Setup.exe
            installer/Istari_Setup.exe.sha256
          generate_release_notes: true
